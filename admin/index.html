<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Panel El Machín</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #2ebd6b; --verde-dark: #1fa055;
    --amarillo: #f5c518; --naranja: #ff6b2b; --naranja-dark: #e05520;
    --rojo: #e8334a; --crema: #fff8ee; --cafe: #3d2010;
    --gris: #f0ebe3; --texto-suave: #9a8070; --sombra: 0 4px 20px rgba(61,32,16,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Nunito', sans-serif; background: var(--crema); color: var(--cafe); min-height: 100vh; padding-bottom: 90px; }
  button, input, select { font-family: inherit; font-size: inherit; color: inherit; }

  header { background: linear-gradient(135deg,#e05520,#e8334a); padding: 12px 16px; position: sticky; top: 0; z-index: 50; box-shadow: 0 3px 16px rgba(232,51,74,.35); }
  .header-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  header h1 { font-family: 'Fredoka One', cursive; font-size: 1.3rem; color: #fff; letter-spacing: .5px; }
  .header-links { display: flex; gap: 8px; }
  .header-links a, .header-links button { background: rgba(255,255,255,.2); color: #fff; border: none; border-radius: 10px; padding: 7px 12px; font-weight: 800; font-size: .8rem; text-decoration: none; cursor: pointer; }

  .tabs { background: #fff; border-bottom: 2px solid var(--gris); position: sticky; top: 56px; z-index: 40; }
  .tabs-inner { max-width: 1100px; margin: 0 auto; display: flex; gap: 4px; overflow-x: auto; padding: 8px 16px; scrollbar-width: thin; }
  .tab { flex-shrink: 0; border: none; background: transparent; border-radius: 10px; padding: 8px 12px; font-weight: 800; font-size: .85rem; color: var(--texto-suave); cursor: pointer; white-space: nowrap; }
  .tab.activa { background: var(--naranja); color: #fff; }

  main { max-width: 1100px; margin: 0 auto; padding: 18px 16px; }
  .sec-title { font-family: 'Fredoka One', cursive; font-size: 1.4rem; margin-bottom: 6px; }
  .sec-desc { color: var(--texto-suave); font-size: .85rem; margin-bottom: 14px; line-height: 1.5; }
  .panel { background: #fff; border-radius: 16px; box-shadow: var(--sombra); padding: 14px; margin-bottom: 16px; }

  /* Login */
  .login { max-width: 360px; margin: 60px auto; text-align: center; }
  .login .icono { font-size: 3rem; }
  .login h2 { font-family: 'Fredoka One', cursive; margin: 8px 0 16px; }
  .login input { width: 100%; margin-bottom: 10px; }

  .input, .tabla input, .tabla select { border: 2px solid var(--gris); border-radius: 10px; padding: 8px 10px; background: #fff; outline: none; transition: border .15s; }
  .input:focus, .tabla input:focus, .tabla select:focus { border-color: var(--naranja); }
  .btn { border: none; border-radius: 12px; padding: 10px 16px; font-weight: 800; cursor: pointer; transition: transform .1s; }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn-primario { background: linear-gradient(135deg,var(--verde),var(--verde-dark)); color: #fff; }
  .btn-naranja { background: var(--naranja); color: #fff; }
  .btn-claro { background: var(--gris); color: var(--cafe); }
  .btn-borde { background: #fff; border: 2px dashed var(--naranja); color: var(--naranja); }
  .btn-peligro { background: #fff0f0; color: var(--rojo); }
  .btn-mini { padding: 5px 8px; border-radius: 8px; font-size: .8rem; }

  /* Tablas editables */
  /* La tabla se desplaza dentro de su contenedor (vertical y horizontal) para que el encabezado
     quede fijo; la altura deja visibles el header, las pestañas y la barra de guardar. */
  .tabla-wrap { overflow: auto; max-height: calc(100vh - 230px); max-height: calc(100dvh - 230px); border-radius: 12px; border: 2px solid var(--gris); background: #fff; }
  .tabla { border-collapse: separate; border-spacing: 0; width: 100%; font-size: .85rem; }
  .tabla th { background: var(--cafe); color: #fff; text-align: left; padding: 8px; font-weight: 800; white-space: nowrap; position: sticky; top: 0; z-index: 2; box-shadow: 0 2px 4px rgba(61,32,16,.25); }
  .tabla th small { display: block; font-weight: 600; opacity: .7; font-size: .7rem; }
  .tabla td { padding: 5px 6px; border-bottom: 1px solid var(--gris); vertical-align: middle; }
  .tabla tr.inactivo td { opacity: .5; }
  .tabla input, .tabla select { width: 100%; padding: 6px 8px; }
  .tabla input[type=text] { min-width: 140px; }
  .tabla select { min-width: 120px; }
  .tabla input[type=number] { min-width: 85px; }
  .tabla input[type=color] { padding: 2px; height: 34px; min-width: 50px; }
  .tabla .acciones { white-space: nowrap; display: flex; gap: 4px; }
  .barra { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .barra label { font-weight: 800; font-size: .85rem; }

  /* Barra de guardar */
  .guardar-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 2px solid var(--gris); box-shadow: 0 -4px 20px rgba(0,0,0,.08); padding: 12px 16px; display: none; z-index: 60; }
  .guardar-bar.visible { display: block; }
  .guardar-inner { max-width: 1100px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
  .guardar-inner span { font-weight: 800; color: var(--naranja-dark); }
  .errores { background: #fff0f0; border: 2px solid #ffd0d0; border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; color: var(--rojo); font-size: .85rem; }
  .errores ul { margin: 6px 0 0 18px; }

  /* Pedidos */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 14px; box-shadow: var(--sombra); padding: 12px 14px; }
  .stat .v { font-family: 'Fredoka One', cursive; font-size: 1.5rem; color: var(--naranja); }
  .stat .l { font-size: .75rem; font-weight: 800; color: var(--texto-suave); }
  .pedido { background: #fff; border-radius: 14px; box-shadow: var(--sombra); margin-bottom: 10px; border-left: 6px solid var(--naranja); }
  .pedido.confirmado { border-left-color: var(--amarillo); }
  .pedido.entregado { border-left-color: var(--verde); }
  .pedido.cancelado { border-left-color: #bbb; opacity: .7; }
  .pedido-top { display: flex; justify-content: space-between; gap: 10px; padding: 12px 14px; cursor: pointer; align-items: flex-start; }
  .pedido-top .folio { font-weight: 800; font-size: .78rem; color: var(--texto-suave); }
  .pedido-top .cliente { font-weight: 800; font-size: 1rem; }
  .pedido-top .meta { font-size: .8rem; color: var(--texto-suave); margin-top: 2px; }
  .pedido-top .total { font-family: 'Fredoka One', cursive; font-size: 1.2rem; color: var(--naranja); white-space: nowrap; text-align: right; }
  .pedido-detalle { display: none; padding: 0 14px 14px; font-size: .85rem; border-top: 1px dashed var(--gris); }
  .pedido.abierto .pedido-detalle { display: block; }
  .pedido-detalle .linea { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px dashed var(--gris); }
  .pedido-detalle .nota { color: var(--texto-suave); font-size: .78rem; }
  .aviso { background: #fffbea; border: 2px solid var(--amarillo); border-radius: 10px; padding: 8px 10px; margin: 10px 0; font-weight: 700; color: #a07800; }
  .chip { display: inline-block; background: var(--gris); border-radius: 8px; padding: 2px 8px; font-size: .72rem; font-weight: 800; margin-left: 4px; }
  .vacio { text-align: center; padding: 40px 16px; color: var(--texto-suave); font-weight: 700; }

  /* Formularios (envío, clientes, tarifario) */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 10px; }
  .campo label { display: block; font-size: .75rem; font-weight: 800; color: var(--texto-suave); margin-bottom: 3px; }
  .campo .input { width: 100%; }
  .campo small { display: block; font-size: .7rem; color: var(--texto-suave); margin-top: 3px; }
  .check { display: flex; align-items: center; gap: 8px; font-weight: 800; cursor: pointer; }
  .check input { width: 20px; height: 20px; accent-color: var(--naranja); }
  .envio-box { background: #f7fbff; border: 2px solid #d6e9f8; border-radius: 12px; padding: 12px; margin-top: 12px; }
  .envio-box h4, .sub-title { font-family: 'Fredoka One', cursive; font-weight: 400; font-size: 1.05rem; margin-bottom: 10px; }
  .mensaje-rep { background: #fff; border: 1.5px dashed #b8d4ea; border-radius: 10px; padding: 10px; white-space: pre-wrap; font-size: .8rem; margin: 10px 0; font-family: inherit; }
  .domicilio { border: 2px solid var(--gris); border-radius: 12px; padding: 10px; margin-bottom: 8px; background: #fffdf9; }
  .cliente-card { background: #fff; border-radius: 14px; box-shadow: var(--sombra); margin-bottom: 10px; padding: 12px 14px; }
  .cliente-card .top { display: flex; justify-content: space-between; gap: 10px; cursor: pointer; }
  .chip-lluvia { background: #e8f3ff; color: #1e6fb5; }
  .chip-lluvia.on { background: #1e8bc3; color: #fff; }

  .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-20px); background: #1a1a1a; color: #fff; padding: 12px 20px; border-radius: 50px; font-size: .88rem; font-weight: 700; z-index: 999; opacity: 0; transition: opacity .25s, transform .25s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .oculto { display: none !important; }

  @media (max-width: 600px) {
    header h1 { font-size: 1.1rem; }
    .tabs { top: 52px; }
    .pedido-top { flex-direction: column; }
    .pedido-top .total { text-align: left; }
  }
</style>
</head>
<body>

<header>
  <div class="header-inner">
    <h1>🦐 Panel El Machín</h1>
    <div class="header-links">
      <a href="../" target="_blank">Ver app ↗</a>
      <button id="btnSalir" class="oculto" onclick="salir()">Salir</button>
    </div>
  </div>
</header>

<!-- LOGIN -->
<div id="vistaLogin" class="login oculto">
  <div class="icono">🔐</div>
  <h2>Entrar al panel</h2>
  <form onsubmit="entrar(event)">
    <input class="input" type="password" id="password" placeholder="Contraseña" autocomplete="current-password" required>
    <button class="btn btn-naranja" style="width:100%">Entrar</button>
  </form>
  <p id="loginError" class="sec-desc" style="margin-top:12px;color:var(--rojo)"></p>
</div>

<!-- PANEL -->
<div id="vistaPanel" class="oculto">
  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
  <main id="contenido"></main>
</div>

<div class="guardar-bar" id="guardarBar">
  <div class="guardar-inner">
    <span>✏️ Tienes cambios sin guardar</span>
    <div style="display:flex;gap:8px">
      <button class="btn btn-claro" onclick="descartar()">Descartar</button>
      <button class="btn btn-primario" id="btnGuardar" onclick="guardarMenu()">💾 Guardar y publicar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API = '../api/admin.php';
let csrf = null;
let menu = null;            // copia en edición
let menuOriginal = '';      // para detectar cambios
let erroresServidor = [];
let tabActual = 'pedidos';
let filtroPrecios = '';
let pedidos = [];
let filtrosPedidos = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dinero = n => '$' + Number(n || 0).toLocaleString('es-MX', {minimumFractionDigits: 2, maximumFractionDigits: 2});
const hoyISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const sumarDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); };

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 2800);
}

async function api(accion, {metodo = 'GET', datos, params = {}} = {}) {
  const qs = new URLSearchParams({accion, ...params});
  const r = await fetch(`${API}?${qs}`, {
    method: metodo, credentials: 'same-origin',
    headers: metodo === 'POST' ? {'Content-Type': 'application/json', 'X-CSRF': csrf || ''} : {},
    body: datos ? JSON.stringify(datos) : undefined,
  });
  const j = await r.json().catch(() => ({ok: false, error: 'Respuesta inválida del servidor'}));
  if (r.status === 401 && accion !== 'login') { mostrarLogin('Tu sesión expiró. Vuelve a entrar.'); throw new Error(j.error); }
  return {...j, status: r.status};
}

// ── Sesión ───────────────────────────────────────────────────────────
async function iniciar() {
  const e = await api('estado');
  if (e.autenticado) { csrf = e.csrf; await abrirPanel(); }
  else mostrarLogin(e.configurado ? '' : 'Primero crea la contraseña en el servidor con: php api/crear-password.php');
}

function mostrarLogin(msg = '') {
  document.getElementById('vistaPanel').classList.add('oculto');
  document.getElementById('btnSalir').classList.add('oculto');
  document.getElementById('guardarBar').classList.remove('visible');
  document.getElementById('vistaLogin').classList.remove('oculto');
  document.getElementById('loginError').textContent = msg;
  document.getElementById('password').focus();
}

async function entrar(ev) {
  ev.preventDefault();
  const r = await api('login', {metodo: 'POST', datos: {password: document.getElementById('password').value}});
  if (!r.ok) { document.getElementById('loginError').textContent = r.error; return; }
  csrf = r.csrf;
  document.getElementById('password').value = '';
  await abrirPanel();
}

async function salir() {
  if (hayCambios() && !confirm('Tienes cambios sin guardar. ¿Salir de todos modos?')) return;
  await api('logout', {metodo: 'POST'});
  menu = null; menuOriginal = '';
  mostrarLogin('Sesión cerrada.');
}

async function abrirPanel() {
  document.getElementById('vistaLogin').classList.add('oculto');
  document.getElementById('vistaPanel').classList.remove('oculto');
  document.getElementById('btnSalir').classList.remove('oculto');
  await cargarMenu();
  renderTabs();
  mostrarTab(tabActual);
}

// ── Menú ─────────────────────────────────────────────────────────────
async function cargarMenu() {
  const r = await api('menu');
  menu = r.menu;
  menuOriginal = JSON.stringify(menu);
  erroresServidor = [];
  actualizarBarra();
}

function hayCambios() { return menu && JSON.stringify(menu) !== menuOriginal; }
function actualizarBarra() { document.getElementById('guardarBar').classList.toggle('visible', !!hayCambios()); }

async function guardarMenu() {
  const btn = document.getElementById('btnGuardar');
  btn.disabled = true;
  try {
    const r = await api('guardar_menu', {metodo: 'POST', datos: {menu}});
    if (r.ok) {
      menuOriginal = JSON.stringify(menu);
      erroresServidor = [];
      toast('✅ Menú guardado. La app ya muestra los cambios.');
    } else {
      erroresServidor = r.errores || [r.error];
      toast('⚠️ No se guardó: revisa los errores');
    }
    mostrarTab(tabActual);
  } finally { btn.disabled = false; actualizarBarra(); }
}

async function descartar() {
  if (!confirm('¿Descartar todos los cambios sin guardar?')) return;
  await cargarMenu();
  mostrarTab(tabActual);
}

window.addEventListener('beforeunload', e => { if (hayCambios()) { e.preventDefault(); e.returnValue = ''; } });

// ── Esquema de cada sección editable ─────────────────────────────────
const SI_NO = ['si', 'no'];
const grupos = (lista) => [...new Set((menu[lista] || []).map(x => x.grupo).filter(Boolean))];

const SECCIONES = {
  productos: {
    titulo: '🍽️ Productos', desc: 'Tarjetas de la pantalla "¿Qué preparado?". <b>nombre</b> es el que sale en el carrito y en WhatsApp; si lo cambias, cambia también sus filas en Precios. Para ocultar un producto sin borrarlo pon activo = no.',
    nueva: () => ({nombre: '', titulo: '', subtitulo: '', icono: '🍽️', color: '#ff6b2b', flujo: 'simple', cobro: 'pieza', sabores: '', tostitos: 'no', picor: 'no', mariscos: '', ancho: 'tercio', activo: 'si', orden: (menu.productos.length + 1)}),
    columnas: [
      {k: 'orden', t: 'number', ayuda: 'posición'},
      {k: 'nombre', ayuda: 'interno'}, {k: 'titulo', ayuda: 'tarjeta'}, {k: 'subtitulo'},
      {k: 'icono', ancho: 70}, {k: 'color', t: 'color'},
      {k: 'flujo', t: 'select', ops: ['marisco', 'michelada', 'simple'], ayuda: 'cómo se arma'},
      {k: 'cobro', t: 'select', ops: ['tamano', 'pieza']},
      {k: 'mariscos', t: 'select', ops: () => ['', ...grupos('mariscos')], ayuda: 'grupo'},
      {k: 'sabores', t: 'select', ops: () => ['', ...grupos('sabores')], ayuda: 'grupo'},
      {k: 'tostitos', t: 'select', ops: SI_NO},
      {k: 'picor', t: 'select', ops: ['obligatorio', 'opcional', 'no']},
      {k: 'ancho', t: 'select', ops: ['tercio', 'medio', 'completo']},
      {k: 'activo', t: 'select', ops: SI_NO},
    ],
  },
  precios: {
    titulo: '💲 Precios', desc: 'Un precio por producto + sabor + marisco. Usa <b>Mixto</b> para cuando el cliente combina 2 o más mariscos. Sabor vacío = aplica a todos los sabores. Los productos por tamaño usan kg / lt / medio; los de pieza usan pieza.',
    nueva: () => ({producto: filtroPrecios || (menu.productos[0]?.nombre ?? ''), sabor: '', marisco: '', kg: '', lt: '', medio: '', pieza: ''}),
    filtro: f => !filtroPrecios || f.producto === filtroPrecios,
    columnas: [
      {k: 'producto', t: 'select', ops: () => menu.productos.map(p => p.nombre)},
      {k: 'sabor', t: 'select', ops: () => ['', ...new Set((menu.sabores || []).filter(s => s.grupo === 'aguachile').map(s => s.nombre))]},
      {k: 'marisco', t: 'select', ops: () => ['', 'Mixto', ...new Set((menu.mariscos || []).map(m => m.clave))]},
      {k: 'kg', t: 'money'}, {k: 'lt', t: 'money'}, {k: 'medio', t: 'money', ayuda: '½ litro'}, {k: 'pieza', t: 'money'},
    ],
  },
  mariscos: {
    titulo: '🦐 Mariscos', desc: 'Opciones de marisco. El <b>grupo</b> se asigna a cada producto (columna mariscos en Productos). solo_combinado = si impide pedirlo solo (como el pulpo).',
    nueva: () => ({grupo: 'general', clave: '', icono: '🦐', etiqueta: '', solo_combinado: 'no', activo: 'si'}),
    columnas: [{k: 'grupo'}, {k: 'clave', ayuda: 'sale en el pedido'}, {k: 'icono', ancho: 70}, {k: 'etiqueta', ayuda: 'texto visible'},
               {k: 'solo_combinado', t: 'select', ops: SI_NO}, {k: 'activo', t: 'select', ops: SI_NO}],
  },
  sabores: {
    titulo: '🎨 Sabores', desc: 'Sabores por grupo. El grupo <b>aguachile</b> es el que pide sabor en los productos con sabores = aguachile; <b>tostitos</b> es el sabor de tostitos.',
    nueva: () => ({grupo: 'aguachile', clave: '', emoji: '', nombre: '', descripcion: ''}),
    columnas: [{k: 'grupo'}, {k: 'clave', ayuda: 'sin espacios'}, {k: 'emoji', ancho: 70}, {k: 'nombre'}, {k: 'descripcion'}],
  },
  micheladas: {
    titulo: '🍺 Micheladas', desc: 'Opciones de micheladas. El precio va en las filas de opción <b>tipo</b>. requiere_camaron = si pide el tipo de camarón.',
    nueva: () => ({opcion: 'cerveza', clave: '', icono: '🍺', descripcion: '', precio: '', requiere_camaron: 'no', activo: 'si'}),
    columnas: [{k: 'opcion', t: 'select', ops: ['cerveza', 'preparado', 'tipo', 'camaron']}, {k: 'clave', ayuda: 'nombre'}, {k: 'icono', ancho: 70},
               {k: 'descripcion'}, {k: 'precio', t: 'money'}, {k: 'requiere_camaron', t: 'select', ops: SI_NO}, {k: 'activo', t: 'select', ops: SI_NO}],
  },
  extras: {
    titulo: '🛍️ Extras y bebidas', desc: 'Complementos y refrescos que se agregan en el carrito. La <b>seccion</b> los agrupa bajo un título.',
    nueva: () => ({nombre: '', icono: '🥤', precio: '', seccion: 'Complementos', activo: 'si'}),
    columnas: [{k: 'nombre'}, {k: 'icono', ancho: 70}, {k: 'precio', t: 'money'}, {k: 'seccion'}, {k: 'activo', t: 'select', ops: SI_NO}],
  },
  operadores: {
    titulo: '💼 Operadores', desc: 'Quién recibe los pedidos por WhatsApp. Número con 521 + 10 dígitos, sin espacios.',
    nueva: () => ({nombre: '', icono: '🧑', whatsapp: '521', activo: 'si'}),
    columnas: [{k: 'nombre'}, {k: 'icono', ancho: 70}, {k: 'whatsapp'}, {k: 'activo', t: 'select', ops: SI_NO}],
  },
  grupos: {
    titulo: '🏷️ Grupos', desc: 'Opciones de "¿De dónde nos conociste?". La clave <b>otro</b> muestra un campo para escribir.',
    nueva: () => ({clave: '', etiqueta: ''}),
    columnas: [{k: 'clave'}, {k: 'etiqueta', ayuda: 'con emoji'}],
  },
  config: {
    titulo: '⚙️ Ajustes', desc: 'Días de entrega (lunes…domingo separados por coma), horarios (formato 24 h separados por coma), hora de corte y número de respaldo.',
    fija: true,
    columnas: [{k: 'clave', t: 'lectura'}, {k: 'valor'}, {k: 'descripcion', t: 'lectura'}],
  },

];

function renderTabs() {

function mostrarTab(k) {

// ── Tabla editable genérica ──────────────────────────────────────────
function htmlSeccion(sec) {
  const s = SECCIONES[sec];
  const filas = menu[sec].map((f, i) => [f, i]).filter(([f]) => !s.filtro || s.filtro(f));
  const extra = sec === 'precios' ? htmlFiltroPrecios() : '';
  return `<section class="panel">
    <div class="sec-title">${s.titulo}</div>
    <p class="sec-desc">${s.desc}</p>
    ${extra}
    <div class="tabla-wrap"><table class="tabla">
      <thead><tr>${s.columnas.map(c => `<th>${esc(c.k)}${c.ayuda ? `<small>${esc(c.ayuda)}</small>` : ''}</th>`).join('')}${s.fija ? '' : '<th></th>'}</tr></thead>
      <tbody>${filas.map(([f, i]) => htmlFila(sec, f, i)).join('') || `<tr><td colspan="${s.columnas.length + 1}" class="vacio">Sin filas</td></tr>`}</tbody>
    </table></div>
    ${s.fija ? '' : `<div class="barra" style="margin-top:10px"><button class="btn btn-borde" onclick="agregarFila('${sec}')">➕ Agregar fila</button></div>`}
  </section>`;
}

function htmlFila(sec, f, i) {
  const s = SECCIONES[sec];
  const inactivo = f.activo !== undefined && f.activo === 'no';
  const celdas = s.columnas.map(c => {
    const v = f[c.k] ?? '';
    const on = `data-sec="${sec}" data-i="${i}" data-k="${c.k}" data-t="${c.t || 'text'}" oninput="editar(this)"`;
    const estilo = c.ancho ? `style="width:${c.ancho}px;min-width:${c.ancho}px"` : '';
    if (c.t === 'lectura') return `<td><b>${esc(v)}</b></td>`;
    if (c.t === 'select') {
      const ops = typeof c.ops === 'function' ? c.ops() : c.ops;
      const lista = ops.includes(v) ? ops : [...ops, v];
      return `<td><select ${on}>${lista.map(o => `<option value="${esc(o)}" ${o === v ? 'selected' : ''}>${esc(o) || '—'}</option>`).join('')}</select></td>`;
    }
    if (c.t === 'color') return `<td><input type="color" value="${esc(v || '#ff6b2b')}" ${on}></td>`;
    if (c.t === 'money' || c.t === 'number') return `<td><input type="number" step="${c.t === 'money' ? '0.5' : '1'}" min="0" value="${esc(v)}" ${on} ${estilo}></td>`;
    return `<td><input type="text" value="${esc(v)}" ${on} ${estilo}></td>`;
  }).join('');
  const acciones = s.fija ? '' : `<td><div class="acciones">
      <button class="btn btn-claro btn-mini" title="Subir" onclick="moverFila('${sec}',${i},-1)">↑</button>
      <button class="btn btn-claro btn-mini" title="Bajar" onclick="moverFila('${sec}',${i},1)">↓</button>
      <button class="btn btn-peligro btn-mini" title="Eliminar" onclick="eliminarFila('${sec}',${i})">🗑️</button>
    </div></td>`;
  return `<tr class="${inactivo ? 'inactivo' : ''}">${celdas}${acciones}</tr>`;
}

function editar(el) {
  const {sec, i, k, t} = el.dataset;
  let v = el.value;
  if (t === 'money' || t === 'number') v = v === '' ? '' : Number(v);
  menu[sec][Number(i)][k] = v;
  if (k === 'activo') el.closest('tr').classList.toggle('inactivo', v === 'no');
  actualizarBarra();
}

function agregarFila(sec) {
  menu[sec].push(SECCIONES[sec].nueva());
  mostrarTab(tabActual);
  actualizarBarra();
  const filas = document.querySelectorAll('.tabla tbody tr');
  filas[filas.length - 1]?.querySelector('input,select')?.focus();
}

function moverFila(sec, i, d) {
  const j = i + d;
  if (j < 0 || j >= menu[sec].length) return;
  [menu[sec][i], menu[sec][j]] = [menu[sec][j], menu[sec][i]];
  mostrarTab(tabActual); actualizarBarra();
}

function eliminarFila(sec, i) {
  const f = menu[sec][i];
  const nombre = f.nombre || f.clave || f.producto || `fila ${i + 1}`;
  if (!confirm(`¿Eliminar "${nombre}"? Si solo quieres ocultarlo, usa activo = no.`)) return;
  menu[sec].splice(i, 1);
  mostrarTab(tabActual); actualizarBarra();
}

// Precios: filtro por producto y generador de filas faltantes
function htmlFiltroPrecios() {
  return `<div class="barra">
    <label for="filtroPrecios">Producto:</label>
    <select class="input" id="filtroPrecios" onchange="filtroPrecios=this.value;mostrarTab('precios')">
      <option value="">Todos</option>
      ${menu.productos.map(p => `<option ${p.nombre === filtroPrecios ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}
    </select>
    ${filtroPrecios ? `<button class="btn btn-claro" onclick="generarPrecios()">🪄 Crear filas faltantes</button>` : ''}
  </div>`;
}

function generarPrecios() {
  const prod = menu.productos.find(p => p.nombre === filtroPrecios);
  if (!prod) return;
  if (prod.flujo === 'michelada') { toast('Las micheladas se cobran en la pestaña Micheladas'); return; }
  const mariscos = prod.flujo === 'marisco'
    ? [...menu.mariscos.filter(m => m.grupo === prod.mariscos && m.activo !== 'no').map(m => m.clave), 'Mixto'] : [''];
  const sabores = prod.sabores ? menu.sabores.filter(s => s.grupo === prod.sabores).map(s => s.nombre) : [''];
  let n = 0;
  for (const sabor of sabores) for (const marisco of mariscos) {
    const existe = menu.precios.some(f => f.producto === prod.nombre && f.marisco === marisco && (f.sabor === sabor || (!f.sabor && !prod.sabores)));
    if (!existe) { menu.precios.push({producto: prod.nombre, sabor, marisco, kg: '', lt: '', medio: '', pieza: ''}); n++; }
  }
  toast(n ? `Se agregaron ${n} filas. Llena los precios.` : 'Ya existen todas las combinaciones');
  mostrarTab('precios'); actualizarBarra();
}

function rangoRapido(tipo) {
  const hoy = hoyISO();
  const d = new Date(hoy + 'T12:00:00');
  if (tipo === 'hoy') return [hoy, hoy];
  if (tipo === 'semana') { const lunes = sumarDias(hoy, -((d.getDay() + 6) % 7)); return [lunes, sumarDias(lunes, 6)]; }
  if (tipo === 'mes') return [hoy.slice(0, 8) + '01', hoy];
  return [sumarDias(hoy, -30), hoy];
}

    (!f.estado || p.estado === f.estado) &&
    (!q || [p.folio, p.cliente.nombre, p.cliente.telefono].some(x => String(x).toLowerCase().includes(q))
        || (q.replace(/\D/g, '').length >= 4 && telDigits(p.cliente.telefono).includes(q.replace(/\D/g, '')))));

function exportarCSV() {
  const lista = pedidosFiltrados();
  const col = ['folio', 'fecha_registro', 'estado', 'cliente', 'telefono', 'operador', 'grupo', 'fecha_entrega', 'hora', 'entrega', 'direccion', 'articulos', 'extras', 'total_comida', 'envio', 'km', 'lluvia', 'forma_pago', 'total_con_envio'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const filas = lista.map(p => [p.folio, p.fecha_registro, p.estado, p.cliente.nombre, p.cliente.telefono, p.operador, p.grupo,
    p.fecha_entrega, p.hora, p.entrega, p.direccion, p.articulos.map(a => a.descripcion || a.producto).join(' | '),
    p.extras.map(e => `${e.nombre} x${e.cantidad}`).join(' | '), p.total_calculado,
    p.envio?.tarifa ?? '', p.envio?.km ?? '', p.envio ? (p.envio.lluvia ? 'si' : 'no') : '', p.envio?.forma_pago ?? '',
    p.total_final ?? p.total_calculado].map(q).join(','));
  const blob = new Blob(['﻿' + [col.join(','), ...filas].join('\r\n')], {type: 'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `pedidos-${filtrosPedidos.desde}-a-${filtrosPedidos.hasta}.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

// ── Envío de pedidos a domicilio ─────────────────────────────────────
// Tarifario: base hasta base_km y precio_km_extra por cada km adicional (o fracción).
// Mismo cálculo que calcular_tarifa() en api/comun.php.
let envioCfg = null;
let envioEdit = {};          // folio -> formulario de envío en edición
const clientesCache = {};    // teléfono (10 dígitos) -> cliente del catálogo

const telDigits = t => String(t || '').replace(/\D/g, '').slice(-10);
const monto = n => Number(n || 0).toLocaleString('es-MX', {maximumFractionDigits: 2});
const hora12 = h => { if (!h) return ''; const [H, M] = h.split(':').map(Number); return `${H % 12 || 12}:${String(M).padStart(2, '0')} ${H >= 12 ? 'PM' : 'AM'}`; };
const linkMapa = g => g ? `https://maps.google.com/?q=${g.lat},${g.lng}` : '';
const gpsTexto = g => g ? `${g.lat}, ${g.lng}` : '';
function parseGps(txt) {
  const m = String(txt).match(/(-?\d{1,2}\.\d+)\s*,\s*(-?\d{1,3}\.\d+)/);
  return m ? {lat: Number(m[1]), lng: Number(m[2])} : null;
}

async function cargarEnvioCfg() {
  if (!envioCfg) envioCfg = (await api('envio')).config;
}

function kmEstimado(gps) {
  if (!gps || !envioCfg) return null;
  const r = envioCfg.restaurante, rad = Math.PI / 180;
  const dLat = (gps.lat - r.lat) * rad, dLng = (gps.lng - r.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r.lat * rad) * Math.cos(gps.lat * rad) * Math.sin(dLng / 2) ** 2;
  const km = 2 * 6371 * Math.asin(Math.min(1, Math.sqrt(h))) * Number(envioCfg.factor_calles || 1);
  return Math.round(km * 10) / 10;
}

function tarifaEnvio(km, lluvia, cfg = envioCfg) {
  const t = cfg[lluvia ? 'lluvia' : 'normal'];
  const extra = Math.max(0, Math.ceil(Math.round((Number(km) - Number(t.base_km)) * 100) / 100));
  return Number(t.base_precio) + extra * Number(t.precio_km_extra);
}

// Efectivo: el repartidor adelanta la comida y le cobra al cliente comida + envío.
// Transferencia: el cliente nos paga todo a nosotros y nosotros le pagamos el envío al repartidor,
// así que el repartidor no paga ni cobra nada.
function recalcularMontos(e, comida) {
  e.ganancia = e.tarifa;
  if (e.forma_pago === 'transferencia') { e.repartidor_paga = 0; e.cliente_paga = 0; }
  else { e.repartidor_paga = comida; e.cliente_paga = comida + e.tarifa; }
}

function pintarBotonLluvia() {
  const b = document.getElementById('btnLluvia');
  if (!b || !envioCfg) return;
  b.classList.toggle('on', !!envioCfg.lluvia_activa);
  b.textContent = envioCfg.lluvia_activa ? '☔ Lloviendo: sí' : '🌤️ Lloviendo: no';
  b.title = 'Tarifa que se propone en los envíos nuevos';
}

async function alternarLluvia() {
  const r = await api('guardar_envio', {metodo: 'POST', datos: {config: {...envioCfg, lluvia_activa: !envioCfg.lluvia_activa}}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  envioCfg = r.config;
  pintarBotonLluvia();
  toast(envioCfg.lluvia_activa ? '☔ Se propondrá la tarifa de lluvia' : '🌤️ Se propondrá la tarifa normal');
}

async function abrirPedido(folio) {
  const el = document.getElementById('p-' + folio);
  el.classList.toggle('abierto');
  const p = pedidos.find(x => x.folio === folio);
  if (!el.classList.contains('abierto') || p?.entrega !== 'domicilio') return;
  if (envioEdit[folio]) pintarEnvio(folio);
  else await iniciarEnvio(p);
}

async function obtenerCliente(tel) {
  if (!(tel in clientesCache)) clientesCache[tel] = (await api('cliente', {params: {telefono: tel}})).cliente;
  return clientesCache[tel];
}

async function iniciarEnvio(p) {
  await cargarEnvioCfg();
  const cli = await obtenerCliente(telDigits(p.cliente.telefono));
  const domId = p.envio?.domicilio_id || p.cliente.domicilio_id || '';
  const dom = cli?.domicilios?.find(d => d.id === domId);
  const gps = dom?.gps || p.gps;
  if (p.envio) {
    envioEdit[p.folio] = {...p.envio, gps};
  } else {
    const e = {domicilio_id: dom ? domId : '', para: dom?.direccion || p.direccion, km: kmEstimado(gps) ?? 0,
               lluvia: !!envioCfg.lluvia_activa, forma_pago: p.forma_pago || 'efectivo', listo: p.hora || '', gps, _sucio: true};
    e.tarifa = tarifaEnvio(e.km, e.lluvia);
    recalcularMontos(e, Number(p.total_calculado));
    envioEdit[p.folio] = e;
  }
  pintarEnvio(p.folio);
}

function mensajeRepartidor(folio) {
  const e = envioEdit[folio];
  return `${envioCfg.restaurante.mapa}\n\n🐙EL MACHÍN🦐\n\n🚨PEDIDO DISPONIBLE🚨\n\n📍PARA: ${e.para}\n\n` +
    `💸 REPARTIDOR PAGA: $${monto(e.repartidor_paga)}\n\n💵 CLIENTE PAGA: $${monto(e.cliente_paga)}\n\n` +
    `💰GANANCIA ENVÍO: $${monto(e.ganancia)}\n\n⏰ PEDIDO LISTO: ${hora12(e.listo)}`;
}

function mensajeCliente(p, e) {
  const comida = Number(p.total_calculado);
  return `Hola ${p.cliente.nombre} 👋\nEste es el total de tu pedido ${p.folio} de El Machín:\n\n` +
    `🍽️ Pedido: $${monto(comida)}\n🛵 Envío: $${monto(e.tarifa)}\n💰 Total: $${monto(comida + Number(e.tarifa))}\n\n` +
    (e.forma_pago === 'transferencia' ? `🏦 Total a transferir: $${monto(comida + Number(e.tarifa))}. Al repartidor no le pagas nada.`
                                      : `💵 Pagas al repartidor en efectivo: $${monto(e.cliente_paga)}`);
}

function pintarEnvio(folio) {
  const box = document.getElementById('envio-' + folio);
  if (!box) return;
  const p = pedidos.find(x => x.folio === folio), e = envioEdit[folio];
  const doms = clientesCache[telDigits(p.cliente.telefono)]?.domicilios || [];
  const est = kmEstimado(e.gps);
  const f = esc(folio);
  const on = (campo, modo) => `data-folio="${f}" data-campo="${campo}" onchange="editarEnvio(this,'${modo}')"`;
  const num = (campo, modo, paso = '0.5') => `<input class="input" type="number" step="${paso}" min="0" value="${e[campo]}" ${on(campo, modo)}>`;
  const sinKmExtra = !Number(envioCfg[e.lluvia ? 'lluvia' : 'normal'].precio_km_extra);
  box.innerHTML = `<h4>🛵 Envío ${e._sucio ? '<span class="chip" style="color:var(--naranja-dark)">sin guardar</span>' : '<span class="chip">✅ guardado</span>'}</h4>
    <div class="form-grid">
      <div class="campo" style="grid-column:1/-1"><label>Domicilio del cliente</label>
        <select class="input" ${on('domicilio_id', 'domicilio')}>
          <option value="">Dirección escrita en el pedido</option>
          ${doms.map(d => `<option value="${esc(d.id)}" ${d.id === e.domicilio_id ? 'selected' : ''}>${d.alias ? esc(d.alias) + ' — ' : ''}${esc(d.direccion)}</option>`).join('')}
        </select></div>
      <div class="campo" style="grid-column:1/-1"><label>📍 PARA (colonia, calle y número)</label>
        <input class="input" value="${esc(e.para)}" ${on('para', 'nada')}></div>
      <div class="campo"><label>Distancia (km)</label>${num('km', 'tarifa', '0.1')}
        <small>${est != null ? `Estimado ${est} km (línea recta × ${envioCfg.factor_calles})${e.gps ? ` · <a href="${linkMapa(e.gps)}" target="_blank">mapa ↗</a>` : ''}` : 'Sin GPS: escribe los km'}</small></div>
      <div class="campo"><label>Tarifario</label>
        <label class="check"><input type="checkbox" ${e.lluvia ? 'checked' : ''} ${on('lluvia', 'tarifa')}> ☔ Lluvia</label></div>
      <div class="campo"><label>Pago del cliente</label>
        <select class="input" ${on('forma_pago', 'montos')}>
          <option value="efectivo" ${e.forma_pago === 'efectivo' ? 'selected' : ''}>💵 Efectivo</option>
          <option value="transferencia" ${e.forma_pago === 'transferencia' ? 'selected' : ''}>🏦 Transferencia (nosotros pagamos al repartidor)</option>
        </select></div>
      <div class="campo"><label>⏰ Pedido listo</label><input class="input" type="time" value="${esc(e.listo)}" ${on('listo', 'nada')}></div>
    </div>
    <div class="form-grid">
      <div class="campo"><label>🛵 Costo de envío</label>${num('tarifa', 'montos')}
        <small>Tarifario: ${dinero(tarifaEnvio(e.km, e.lluvia))}${sinKmExtra ? ' · ⚠️ configura el costo por km extra en 🛵 Envíos' : ''}</small></div>
      <div class="campo"><label>💸 Repartidor paga</label>${num('repartidor_paga', 'nada')}</div>
      <div class="campo"><label>💵 Cliente paga</label>${num('cliente_paga', 'nada')}</div>
      <div class="campo"><label>💰 Ganancia envío</label>${num('ganancia', 'nada')}</div>
    </div>
    <div class="mensaje-rep">${esc(mensajeRepartidor(folio))}</div>
    <div class="barra" style="margin-bottom:0">
      <button class="btn btn-primario btn-mini" onclick="guardarEnvio('${f}')">💾 Guardar envío y total</button>
      <button class="btn btn-claro btn-mini" onclick="copiarTexto(mensajeRepartidor('${f}'))">📋 Copiar mensaje</button>
      <a class="btn btn-claro btn-mini" target="_blank" href="https://wa.me/?text=${encodeURIComponent(mensajeRepartidor(folio))}">🛵 Enviar al repartidor</a>
      <a class="btn btn-claro btn-mini" target="_blank" href="https://wa.me/52${telDigits(p.cliente.telefono)}?text=${encodeURIComponent(mensajeCliente(p, e))}">💬 Avisar total al cliente</a>
    </div>`;
}

// modo: domicilio (cambia dirección y km) → tarifa (recalcula tarifa) → montos (recalcula montos); nada = solo guarda el valor
function editarEnvio(el, modo) {
  const {folio, campo} = el.dataset;
  const e = envioEdit[folio], p = pedidos.find(x => x.folio === folio);
  let v = el.type === 'checkbox' ? el.checked : el.value;
  if (['km', 'tarifa', 'repartidor_paga', 'cliente_paga', 'ganancia'].includes(campo)) v = Number(v) || 0;
  e[campo] = v;
  e._sucio = true;
  if (modo === 'domicilio') {
    const d = clientesCache[telDigits(p.cliente.telefono)]?.domicilios?.find(x => x.id === v);
    e.para = d ? d.direccion : p.direccion;
    e.gps = d ? d.gps : p.gps;
    const km = kmEstimado(e.gps);
    if (km != null) e.km = km;
    modo = 'tarifa';
  }
  if (modo === 'tarifa') { e.tarifa = tarifaEnvio(e.km, e.lluvia); modo = 'montos'; }
  if (modo === 'montos') recalcularMontos(e, Number(p.total_calculado));
  pintarEnvio(folio);
}

async function guardarEnvio(folio) {
  const {gps, _sucio, ...envio} = envioEdit[folio];
  const r = await api('envio_pedido', {metodo: 'POST', datos: {folio, envio}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  const p = pedidos.find(x => x.folio === folio);
  p.envio = r.envio; p.total_final = r.total_final;
  envioEdit[folio] = {...r.envio, gps};
  pintarPedidos();
  document.getElementById('p-' + folio)?.classList.add('abierto');
  pintarEnvio(folio);
  toast(`✅ Envío guardado. Total del pedido: ${dinero(r.total_final)}`);
}

async function copiarTexto(texto) {
  try { await navigator.clipboard.writeText(texto); }
  catch {
    const t = document.createElement('textarea');
    t.value = texto; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
  toast('📋 Mensaje copiado');
}

// ── Tarifario (pestaña 🛵 Envíos) ────────────────────────────────────
let cfgEdit = null;

async function renderEnvios() {
  await cargarEnvioCfg();
  cfgEdit = structuredClone(envioCfg);
  pintarEnvios();
}

function pintarEnvios() {
  const c = cfgEdit;
  const campoT = (t, k, label, paso = '1') => `<div class="campo"><label>${label}</label>
    <input class="input" type="number" min="0" step="${paso}" value="${c[t][k]}" onchange="cfgEdit.${t}.${k}=Number(this.value)||0;pintarEnvios()"></div>`;
  const ejemplo = [3, 5, 6, 8, 10, 12];
  document.getElementById('contenido').innerHTML = `
    <div class="sec-title">🛵 Envíos a domicilio</div>
    <p class="sec-desc">Tarifario del repartidor: precio base hasta cierta distancia y un costo por cada km adicional (se cobra el km completo aunque sea fracción). Hay un tarifario normal y otro para lluvia.</p>
    <section class="panel">
      <div class="sub-title">🌤️ Tarifa normal</div>
      <div class="form-grid">${campoT('normal', 'base_km', 'Km incluidos en la base', '0.5')}${campoT('normal', 'base_precio', 'Precio base ($)', '0.5')}${campoT('normal', 'precio_km_extra', 'Costo por km extra ($)', '0.5')}</div>
      <div class="sub-title">☔ Tarifa con lluvia</div>
      <div class="form-grid">${campoT('lluvia', 'base_km', 'Km incluidos en la base', '0.5')}${campoT('lluvia', 'base_precio', 'Precio base ($)', '0.5')}${campoT('lluvia', 'precio_km_extra', 'Costo por km extra ($)', '0.5')}</div>
      <label class="check" style="margin:6px 0 12px"><input type="checkbox" ${c.lluvia_activa ? 'checked' : ''} onchange="cfgEdit.lluvia_activa=this.checked"> ☔ Está lloviendo (proponer tarifa de lluvia en los envíos nuevos)</label>
      <div class="tabla-wrap" style="max-height:none"><table class="tabla"><thead><tr><th>Distancia</th>${ejemplo.map(k => `<th>${k} km</th>`).join('')}</tr></thead><tbody>
        <tr><td><b>Normal</b></td>${ejemplo.map(k => `<td>${dinero(tarifaEnvio(k, false, c))}</td>`).join('')}</tr>
        <tr><td><b>Lluvia</b></td>${ejemplo.map(k => `<td>${dinero(tarifaEnvio(k, true, c))}</td>`).join('')}</tr>
      </tbody></table></div>
    </section>
    <section class="panel">
      <div class="sub-title">📍 Ubicación del restaurante</div>
      <div class="form-grid">
        <div class="campo" style="grid-column:1/-1"><label>Enlace de Google Maps (primera línea del mensaje al repartidor)</label>
          <input class="input" value="${esc(c.restaurante.mapa)}" onchange="cfgEdit.restaurante.mapa=this.value.trim()"></div>
        <div class="campo"><label>Coordenadas (lat, lng)</label>
          <input class="input" value="${esc(gpsTexto(c.restaurante))}" onchange="const g=parseGps(this.value); if(g){Object.assign(cfgEdit.restaurante,g)} else {toast('Formato: 19.1273, -104.3460')}">
          <small>Se usan para estimar los km a cada domicilio.</small></div>
        <div class="campo"><label>Factor de calles</label>
          <input class="input" type="number" min="1" max="3" step="0.05" value="${c.factor_calles}" onchange="cfgEdit.factor_calles=Number(this.value)||1">
          <small>La distancia en línea recta se multiplica por este número para aproximar el recorrido por calles.</small></div>
      </div>
    </section>
    <button class="btn btn-primario" onclick="guardarTarifario()">💾 Guardar tarifario</button>`;
}

async function guardarTarifario() {
  const r = await api('guardar_envio', {metodo: 'POST', datos: {config: cfgEdit}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  envioCfg = r.config; cfgEdit = structuredClone(envioCfg);
  envioEdit = {};
  pintarEnvios();
  toast('✅ Tarifario guardado');
}

// ── Clientes ─────────────────────────────────────────────────────────
let clientes = [];
let clienteAbierto = null;   // teléfono del cliente en edición, o 'nuevo'
let clienteEdit = null;
let buscarCliente = '';

async function renderClientes() {
  document.getElementById('contenido').innerHTML = `
    <div class="sec-title">👥 Clientes</div>
    <p class="sec-desc">Se registran solos con cada pedido (por teléfono) y guardan cada domicilio nuevo. Aquí puedes corregir datos, ponerle nombre a cada domicilio (ej. <i>Casa de mamá</i>) y agregar su ubicación GPS para estimar el envío.</p>
    <div class="panel"><div class="barra" style="margin-bottom:0">
      <input class="input" type="search" placeholder="Buscar nombre, teléfono o dirección" value="${esc(buscarCliente)}" oninput="buscarCliente=this.value;pintarClientes()" style="flex:1;min-width:200px">
      <button class="btn btn-naranja btn-mini" onclick="nuevoCliente()">➕ Nuevo cliente</button>
    </div></div>
    <div id="clientesLista"><div class="vacio">⏳ Cargando...</div></div>`;
  clientes = (await api('clientes')).clientes || [];
  pintarClientes();
}

function pintarClientes() {
  const q = buscarCliente.trim().toLowerCase();
  const lista = clientes.filter(c => !q || [c.nombre, c.telefono, ...c.domicilios.map(d => `${d.alias} ${d.direccion}`)]
    .some(x => String(x).toLowerCase().includes(q)));
  const nuevo = clienteAbierto === 'nuevo' ? `<div class="cliente-card">${htmlEditorCliente()}</div>` : '';
  document.getElementById('clientesLista').innerHTML = nuevo + (lista.map(c => `<div class="cliente-card">
      ${c.telefono === clienteAbierto ? htmlEditorCliente() : `<div class="top" onclick="abrirCliente('${esc(c.telefono)}')">
        <div><div class="cliente">${esc(c.nombre)} <span class="chip">📱 ${esc(c.telefono)}</span></div>
          <div class="meta">🏠 ${c.domicilios.length} domicilio(s) · 🧾 ${c.total_pedidos || 0} pedido(s)${c.ultimo_pedido ? ' · último ' + esc(new Date(c.ultimo_pedido).toLocaleDateString('es-MX')) : ''}</div></div>
        <span class="chip">✏️ Editar</span></div>`}
    </div>`).join('') || (nuevo ? '' : '<div class="vacio">No hay clientes todavía. Se agregan solos con cada pedido.</div>'));
}

function abrirCliente(tel) {
  clienteAbierto = tel;
  clienteEdit = structuredClone(clientes.find(c => c.telefono === tel));
  pintarClientes();
}

function nuevoCliente() {
  clienteAbierto = 'nuevo';
  clienteEdit = {telefono: '', nombre: '', grupo: '', notas: '', domicilios: []};
  pintarClientes();
}

function cerrarCliente() { clienteAbierto = null; clienteEdit = null; pintarClientes(); }

function htmlEditorCliente() {
  const c = clienteEdit;
  const campo = (k, label, ancho = '') => `<div class="campo" ${ancho}><label>${label}</label>
    <input class="input" value="${esc(c[k])}" oninput="clienteEdit.${k}=this.value"></div>`;
  const dom = (d, i) => `<div class="domicilio">
      <div class="form-grid">
        <div class="campo"><label>Nombre del domicilio</label><input class="input" placeholder="Ej. Casa de mamá" value="${esc(d.alias)}" oninput="clienteEdit.domicilios[${i}].alias=this.value"></div>
        <div class="campo" style="grid-column:span 2"><label>Dirección (colonia, calle y número)</label><input class="input" value="${esc(d.direccion)}" oninput="clienteEdit.domicilios[${i}].direccion=this.value"></div>
        <div class="campo" style="grid-column:span 2"><label>Referencias</label><input class="input" value="${esc(d.referencia)}" oninput="clienteEdit.domicilios[${i}].referencia=this.value"></div>
        <div class="campo"><label>GPS (lat, lng)</label><input class="input" placeholder="19.12, -104.34" value="${esc(gpsTexto(d.gps))}"
          onchange="clienteEdit.domicilios[${i}].gps=parseGps(this.value); if(this.value && !clienteEdit.domicilios[${i}].gps) toast('Formato: 19.1273, -104.3460')">
          <small>${d.gps ? `<a href="${linkMapa(d.gps)}" target="_blank">Ver mapa ↗</a> · ~${kmEstimado(d.gps) ?? '?'} km` : 'Pega las coordenadas de Google Maps'}</small></div>
      </div>
      <button class="btn btn-peligro btn-mini" onclick="clienteEdit.domicilios.splice(${i},1);pintarClientes()">🗑️ Quitar domicilio</button>
    </div>`;
  return `<div class="sub-title">${clienteAbierto === 'nuevo' ? '➕ Nuevo cliente' : '✏️ ' + esc(c.nombre)}</div>
    <div class="form-grid">${campo('nombre', 'Nombre')}${campo('telefono', 'Teléfono (10 dígitos)')}${campo('grupo', 'Grupo')}${campo('notas', 'Notas', 'style="grid-column:1/-1"')}</div>
    <div class="sub-title" style="margin-top:6px">🏠 Domicilios</div>
    ${c.domicilios.map(dom).join('') || '<p class="sec-desc">Sin domicilios.</p>'}
    <div class="barra" style="margin:10px 0 0">
      <button class="btn btn-borde btn-mini" onclick="clienteEdit.domicilios.push({id:'',alias:'',direccion:'',referencia:'',gps:null});pintarClientes()">➕ Agregar domicilio</button>
      <button class="btn btn-primario btn-mini" onclick="guardarCliente()">💾 Guardar</button>
      <button class="btn btn-claro btn-mini" onclick="cerrarCliente()">Cancelar</button>
      ${clienteAbierto !== 'nuevo' ? `<button class="btn btn-claro btn-mini" onclick="verPedidosCliente('${esc(clienteAbierto)}')">📋 Ver pedidos</button>
      <button class="btn btn-peligro btn-mini" onclick="eliminarCliente()">🗑️ Eliminar cliente</button>` : ''}
    </div>`;
}

async function guardarCliente() {
  const original = clienteAbierto === 'nuevo' ? '' : clienteAbierto;
  const r = await api('guardar_cliente', {metodo: 'POST', datos: {telefono_original: original, cliente: clienteEdit}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  clientes = clientes.filter(c => c.telefono !== original && c.telefono !== r.cliente.telefono);
  clientes.unshift(r.cliente);
  delete clientesCache[original]; clientesCache[r.cliente.telefono] = r.cliente;
  envioEdit = {};
  cerrarCliente();
  toast('✅ Cliente guardado');
}

async function eliminarCliente() {
  if (!confirm(`¿Eliminar a ${clienteEdit.nombre} y sus domicilios? Sus pedidos no se borran.`)) return;
  const r = await api('eliminar_cliente', {metodo: 'POST', datos: {telefono: clienteAbierto}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  clientes = clientes.filter(c => c.telefono !== clienteAbierto);
  delete clientesCache[clienteAbierto];
  cerrarCliente();
  toast('Cliente eliminado');
}

function verPedidosCliente(tel) {
  filtrosPedidos = {por: 'registro', desde: sumarDias(hoyISO(), -365), hasta: hoyISO(), operador: '', estado: '', buscar: tel};
  mostrarTab('pedidos');
}

// ── Respaldos ────────────────────────────────────────────────────────
async function renderRespaldos() {
  const c = document.getElementById('contenido');
  c.insertAdjacentHTML('beforeend', `<section class="panel"><div class="sec-title">🗂️ Respaldos del menú</div>
    <p class="sec-desc">Cada vez que guardas se hace una copia del menú anterior (se guardan las últimas 60). Restaurar reemplaza el menú actual por esa copia; el actual también se respalda antes.</p>
    <div id="respaldosLista"><div class="vacio">⏳ Cargando...</div></div></section>`);
  const r = await api('respaldos');
  const lista = r.respaldos || [];
  document.getElementById('respaldosLista').innerHTML = lista.length
    ? `<div class="tabla-wrap"><table class="tabla"><thead><tr><th>Fecha</th><th>Archivo</th><th></th></tr></thead><tbody>
        ${lista.map(x => `<tr><td>${esc(new Date(x.fecha).toLocaleString('es-MX'))}</td><td>${esc(x.archivo)}</td>
          <td><button class="btn btn-claro btn-mini" onclick="restaurar('${esc(x.archivo)}')">↩️ Restaurar</button></td></tr>`).join('')}
      </tbody></table></div>`
    : '<div class="vacio">Aún no hay respaldos. Se crean al guardar el menú.</div>';
}

async function restaurar(archivo) {
  if (hayCambios()) { toast('Primero guarda o descarta tus cambios'); return; }
  if (!confirm(`¿Restaurar el menú de ${archivo}? El menú actual se respalda antes.`)) return;
  const r = await api('restaurar', {metodo: 'POST', datos: {archivo}});
  if (!r.ok) { toast('⚠️ ' + r.error); return; }
  await cargarMenu();
  toast('✅ Menú restaurado');
  mostrarTab('respaldos');
}

iniciar();
</script>
